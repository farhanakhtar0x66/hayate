plugins { id 'com.android.application' }

android {
    namespace 'dev.hayate.keyboard'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.hayate.keyboard'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.2.0'
        testInstrumentationRunner 'dev.hayate.keyboard.KeyboardSmokeTest'
    }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}

dependencies {
    implementation 'io.gitlab.rxp90:jsymspell:1.0'
    testImplementation 'junit:junit:4.13.2'
}
